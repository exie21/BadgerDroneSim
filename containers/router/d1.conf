[General]
DebugLogLevel = info
# Mission Planner reaches this server only through the loopback-only Compose
# port mapping in d1.compose.yaml.
TcpServerPort = 5761

[TcpEndpoint sitl]
Address = 172.30.0.2
Port = 5760
RetryTimeout = 1

# This normal endpoint pushes FC telemetry to the synthetic target source.
[UdpEndpoint target-telemetry]
Mode = Normal
Address = 172.30.0.10
Port = 14551

# Receive-only proof of the packets routed from the target source.
[UdpEndpoint target-evidence]
Mode = Normal
Address = 172.30.0.11
Port = 14553

# The target source returns data through this distinct endpoint.  It is the
# only non-GCS command ingress and accepts LANDING_TARGET (MAVLink ID 149)
# only.
[UdpEndpoint target-input]
Mode = Server
Address = 0.0.0.0
Port = 14552
AllowMsgIdIn = 149
