name: badger-d1

services:
  sitl:
    build:
      context: ..
      dockerfile: containers/sitl/Dockerfile
      args:
        ARDUPILOT_COMMIT: dbe792162d06cab66c3475fd5556bf7a120f119e
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    user: "1000:1000"
    environment:
      HOME: /state
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    volumes:
      - ../artifacts/d1/sitl:/state
    networks:
      d1:
        ipv4_address: 172.30.0.2
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 5760), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    command:
      - --vehicle
      - ArduCopter
      - --no-mavproxy
      - --no-rebuild
      - --speedup
      - "1"
      # D1 must start with its telemetry overlay, rather than values persisted
      # by an earlier local SITL run in the ignored /state eeprom.bin.
      - --wipe
      - --add-param-file=/opt/badger/d1-telemetry.param

  router:
    build:
      context: ..
      dockerfile: containers/router/Dockerfile
      args:
        MAVLINK_ROUTER_COMMIT: 42529d55b665e0a9a29e424e186f514c56c2e5b5
        ROUTER_CONFIG: containers/router/d1.conf
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    user: "1000:1000"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    depends_on:
      sitl:
        condition: service_healthy
    ports:
      - "127.0.0.1:5761:5761"
    networks: [d1]

  precision-target:
    build:
      context: ..
      dockerfile: containers/precision-target/Dockerfile
      args:
        PYMAVLINK_VERSION: 2.4.50
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    user: "1000:1000"
    environment:
      D1_TARGET_NORTH_M: "${D1_TARGET_NORTH_M:-5.0}"
      D1_TARGET_EAST_M: "${D1_TARGET_EAST_M:-0.0}"
      D1_TARGET_DOWN_M: "${D1_TARGET_DOWN_M:-0.0}"
      # Default ArduPilot SITL home, used only by the D1 simulation conversion
      # from GLOBAL_POSITION_INT to the fixed scenario's local NED frame.
      D1_HOME_LAT_DEG: "${D1_HOME_LAT_DEG:--35.363261}"
      D1_HOME_LON_DEG: "${D1_HOME_LON_DEG:-149.165230}"
      D1_RATE_HZ: "5.0"
      D1_STATE_MAX_AGE_S: "0.5"
      D1_TELEMETRY_HOST: router
      D1_TELEMETRY_PORT: "5761"
      D1_ROUTER_HOST: router
      D1_ROUTER_PORT: "14552"
      # Zero means stream until the operator stops the profile. A positive
      # value is a SIM-only target-loss injection after that many seconds.
      D1_STREAM_DURATION_S: "${D1_STREAM_DURATION_S:-0.0}"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    depends_on:
      router:
        condition: service_started
    networks: [d1]

  target-evidence:
    build:
      context: ..
      dockerfile: containers/precision-target/Dockerfile
      args:
        PYMAVLINK_VERSION: 2.4.50
    entrypoint: ["python3", "-m", "badger_precision_target.evidence"]
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    user: "1000:1000"
    environment:
      D1_EVIDENCE_BIND_HOST: 0.0.0.0
      D1_EVIDENCE_BIND_PORT: "14553"
      D1_EVIDENCE_TIMEOUT_S: "30"
      D1_EVIDENCE_MIN_VALID_SAMPLES: "3"
      D1_EVIDENCE_PATH: /state/landing-target-evidence.json
      MAVLINK20: "1"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - ../artifacts/d1/evidence:/state
    depends_on:
      router:
        condition: service_started
    networks:
      d1:
        ipv4_address: 172.30.0.11

networks:
  d1:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
